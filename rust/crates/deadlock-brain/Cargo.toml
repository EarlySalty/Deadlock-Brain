[package]
name = "deadlock-brain"
version.workspace = true
edition.workspace = true

[[bin]]
name = "deadlock-brain"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
urlencoding.workspace = true
brain-client = { path = "../brain-client" }
brain-contracts = { path = "../brain-contracts" }
brain-feeds = { path = "../brain-feeds" }
brain-maintenance = { path = "../brain-maintenance" }
brain-storage = { path = "../brain-storage" }
chrono.workspace = true
clap.workspace = true
deadlock-brain-core = { path = "../deadlock-brain-core" }
dbrain-builds = { path = "../dbrain-builds" }
dbrain-enrich = { path = "../dbrain-enrich" }
dbrain-learn = { path = "../dbrain-learn" }
dbrain-normalize = { path = "../dbrain-normalize" }
dbrain-population = { path = "../dbrain-population" }
dbrain-retrieval = { path = "../dbrain-retrieval" }
dbrain-reasoner = { path = "../dbrain-reasoner" }
dbrain-sources = { path = "../dbrain-sources" }
dl-token-secrets = { path = "../../../../Deadlock-Bots/rust/crates/dl-token-secrets" }
hex.workspace = true
postgres.workspace = true
reqwest.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
zeroize = "1"
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
reqwest.workspace = true
tempfile.workspace = true
