[package]
name = "dbrain-s12-wiki-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

# Workspace parser implementation; package name retained for CLI/import compatibility.

[dependencies]
brain-contracts = { path = "../brain-contracts" }
dbrain-normalize = { path = "../dbrain-normalize" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
brain-storage = { path = "../brain-storage" }
brain-kernel = { path = "../brain-kernel" }
dbrain-retrieval = { path = "../dbrain-retrieval" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
