[package]
name = "dbrain-reasoner"
version.workspace = true
edition.workspace = true

[lib]
name = "dbrain_reasoner"
path = "src/lib.rs"

[dependencies]
deadlock-brain-core = { path = "../deadlock-brain-core" }
dbrain-builds = { path = "../dbrain-builds" }
dbrain-population = { path = "../dbrain-population" }
serde.workspace = true
# Frozen population coefficients must survive serialize/deserialize bit-exactly.
# Enable this for production as well as examples, not only in test builds.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

sha2.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
