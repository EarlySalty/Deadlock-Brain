[package]
publish.workspace = true
name = "dbrain-reasoner"
version.workspace = true
edition.workspace = true

[lib]
name = "dbrain_reasoner"
path = "src/lib.rs"

[dependencies]
deadlock-brain-core = { path = "../deadlock-brain-core", version = "0.1.0" }
dbrain-builds = { path = "../dbrain-builds", version = "0.1.0" }
dbrain-population = { path = "../dbrain-population", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
