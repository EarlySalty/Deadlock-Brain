[package]
name = "brain-storage"
version.workspace = true
edition.workspace = true

[lib]
name = "brain_storage"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
brain-contracts = { path = "../brain-contracts" }
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
sqlx = { workspace = true, features = ["json"] }
postgres = { workspace = true, features = ["with-serde_json-1"] }
# Already locked transitively by postgres; expose the same driver for bounded startup.
tokio-postgres = { version = "=0.7.18", features = ["with-serde_json-1"] }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
sha2.workspace = true
