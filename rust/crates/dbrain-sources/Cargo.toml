[package]
name = "dbrain-sources"
version.workspace = true
edition.workspace = true

[lib]
name = "dbrain_sources"
path = "src/lib.rs"

[features]
analytics-fixtures = []

[dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.28"
brain-contracts = { path = "../brain-contracts" }
brain-storage = { path = "../brain-storage" }
dbrain-retrieval = { path = "../dbrain-retrieval" }
dbrain-s12-wiki-probe = { path = "../dbrain-wiki" }
deadlock-brain-core = { path = "../deadlock-brain-core" }
regex.workspace = true
reqwest.workspace = true
roxmltree.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
chrono.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tempfile.workspace = true

[dev-dependencies]
dbrain-normalize = { path = "../dbrain-normalize" }
tokio = { workspace = true, features = ["macros"] }
