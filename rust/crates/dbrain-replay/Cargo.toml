[package]
name = "dbrain-replay"
version.workspace = true
edition = "2024"
rust-version = "1.88"

[dependencies]
brain-contracts = { path = "../brain-contracts" }
deadlock-brain-core = { path = "../deadlock-brain-core" }
haste_core = { git = "https://github.com/deadlock-api/haste", rev = "bfb292d4798031350861ad297aa26753267a1ea6", default-features = false }
# EXACT transitive schema used by haste; do not substitute the upstream default branch.
valveprotos = { git = "https://github.com/deadlock-api/valveprotos-rs.git", rev = "4f4a3cb1b0c6f19af59a722acb79ecccd01f61f6", default-features = false, features = ["gc-client", "serde", "user-msgs"] }
prost = "=0.14.4"
snap = "=1.1.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
nix = { version = "=0.29.0", default-features = false, features = ["resource"] }
seccompiler = "=0.5.0"
libc = "=0.2.186"

[dev-dependencies]
proptest = "=1.10.0"

[[bin]]
name = "dbrain-replay-worker"
path = "src/main.rs"
