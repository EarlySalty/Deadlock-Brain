[package]
name = "dbrain-retrieval"
version.workspace = true
edition.workspace = true

[lib]
name = "dbrain_retrieval"
path = "src/lib.rs"

[dependencies]
brain-contracts = { path = "../brain-contracts" }
brain-storage = { path = "../brain-storage" }
deadlock-brain-core = { path = "../deadlock-brain-core" }
dbrain-reasoner = { path = "../dbrain-reasoner" }
chrono = { workspace = true }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["json", "chrono"] }
thiserror.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util"] }
