[package]
name = "dbrain-pg-migrate"
version.workspace = true
edition.workspace = true

# Phase-1 one-shot migration tool: liest die Brain-SQLite read-only (rusqlite)
# und laedt die 36 Basistabellen FK-sicher nach brain.* in Postgres (postgres crate).
# Steht bewusst als isoliertes Bin-Crate neben den funktionalen Crates, damit der
# spaetere sqlx-Cutover (Phase 2+) davon unberuehrt bleibt.

[[bin]]
name = "dbrain-pg-migrate"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
chrono.workspace = true
postgres = { workspace = true, features = ["with-serde_json-1", "with-chrono-0_4"] }
