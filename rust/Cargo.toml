[workspace]
resolver = "2"
members = [
  "crates/deadlock-brain",
  "crates/deadlock-brain-core",
  "crates/deadlock-brain-yt",
  "crates/dbrain-enrich",
  "crates/dbrain-builds",
  "crates/dbrain-learn",
  "crates/dbrain-normalize",
  "crates/dbrain-retrieval",
  "crates/dbrain-sources",
  "crates/dbrain-pg-migrate",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
postgres = "0.19"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "json", "rustls-tls"] }
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"
thiserror = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time"] }
urlencoding = "2.1"
wait-timeout = "0.2"
