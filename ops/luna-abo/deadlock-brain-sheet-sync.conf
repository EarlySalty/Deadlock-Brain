# Vorlage: C9 ersetzt @RELEASE_ROOT@ vor Aktivierung durch den vollständigen SHA-Releasepfad.
# Der gerenderte Diff gehört ins gemeinsame Gruppengate. Noch nicht installiert oder geprüft.
# Der Jobstamm erhält config/bot.toml mit [ai], [infisical] und [settings].
[Service]
WorkingDirectory=@RELEASE_ROOT@/legacy/sheet-sync
ExecStart=
ExecStart=@RELEASE_ROOT@/legacy/sheet-sync/deadlock-brain refresh-sheet
ExecStart=@RELEASE_ROOT@/legacy/sheet-sync/deadlock-brain learn analyze-next --limit 20
ExecStart=@RELEASE_ROOT@/legacy/sheet-sync/deadlock-brain enrich patch-impact --limit 50
ExecStart=@RELEASE_ROOT@/legacy/sheet-sync/deadlock-brain enrich meta-trends
