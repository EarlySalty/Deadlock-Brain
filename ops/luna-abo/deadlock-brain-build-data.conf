# Vorlage: C9 ersetzt @RELEASE_ROOT@ vor Aktivierung durch den vollständigen SHA-Releasepfad.
# Der gerenderte Diff gehört ins gemeinsame Gruppengate. Noch nicht installiert oder geprüft.
# Der Jobstamm erhält config/bot.toml mit [ai], [infisical] und [settings].
# Die beiden Populationsschritte dürfen wie bisher unabhängig fehlschlagen.
[Service]
WorkingDirectory=@RELEASE_ROOT@/legacy/build-data
ExecStart=
ExecStart=@RELEASE_ROOT@/legacy/build-data/deadlock-brain pull build-data --hero all
ExecStart=-@RELEASE_ROOT@/legacy/build-data/deadlock-brain population sync --matches 2000
ExecStart=-@RELEASE_ROOT@/legacy/build-data/deadlock-brain population stats
