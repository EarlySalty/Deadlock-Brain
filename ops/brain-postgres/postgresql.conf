listen_addresses = ''
port = 5446
unix_socket_directories = '/run/deadlock-brain-postgresql'
unix_socket_group = 'deadlock-brain-db'
unix_socket_permissions = 0770

max_connections = 40
superuser_reserved_connections = 3
password_encryption = scram-sha-256
ssl = off

shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 128MB
wal_level = replica
max_wal_size = 1GB
min_wal_size = 128MB
checkpoint_timeout = 10min
archive_mode = off

data_directory = '/var/lib/deadlock-brain/postgresql'
hba_file = '/etc/deadlock-brain/postgresql/pg_hba.conf'
ident_file = '/etc/deadlock-brain/postgresql/pg_ident.conf'

logging_collector = on
log_directory = '/var/log/deadlock-brain/postgresql'
log_filename = 'postgresql-%a.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 0
log_file_mode = 0600
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d app=%a '
log_min_duration_statement = 1000
log_statement = 'ddl'
log_lock_waits = on
log_temp_files = 0

idle_in_transaction_session_timeout = 60s
statement_timeout = 0
lc_messages = 'C'
timezone = 'UTC'
