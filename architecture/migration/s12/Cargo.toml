[package]
name = "dbrain-s12-wiki-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

# Standalone test workspace, also used as a library by dbrain-sources.
# Capture/report/IR types remain adapter diagnostics; canonical DTOs are imported
# from the existing brain-contracts crate, never redefined here.
[workspace]

[dependencies]
brain-contracts = { path = "../../../rust/crates/brain-contracts" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
chrono = { version = "0.4", default-features = false, features = ["std"] }
