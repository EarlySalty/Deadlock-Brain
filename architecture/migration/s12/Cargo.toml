[package]
name = "dbrain-s12-wiki-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

# S12 preparation only: intentionally NOT a production workspace member.
# Capture/report types are offline diagnostics, not SourceRecord/Fact/Card contracts.
[workspace]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
chrono = { version = "0.4", default-features = false, features = ["std"] }
