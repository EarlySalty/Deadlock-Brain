[package]
name = "wiki-pruefharness-a"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
chrono = "0.4"
deadlock-brain-core = { path = "../../../rust/crates/deadlock-brain-core" }
regex = "1.10"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros"] }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
