version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: cargo
    directory: /rust
    schedule: {interval: weekly}
  - package-ecosystem: cargo
    directory: /scripts/ci
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /requirements
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /rust/python_worker
    schedule: {interval: weekly}
