name: "PR Release Gate"

# Report-only. PR-first-Testbetrieb vom 24.09.2026: grüne Checks dürfen nicht
# eigenmächtig mergen. Dieser Workflow läuft nur manuell, hat keine
# Schreibrechte und aktualisiert oder merged keinen Branch. Er meldet je PR,
# ob die Pflichtprüfungen auf dem aktuellen Head-SHA grün sind. Gemergt wird
# ausschließlich nach unabhängigem Review regulär per Hand.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional pull request number. Empty reports all open pull requests."
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: pr-release-gate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  report:
    name: "Merge readiness report"
    runs-on: ubuntu-latest
    steps:
      - name: Report merge readiness of pull requests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number || '' }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const requested = Number.parseInt(process.env.INPUT_PR_NUMBER || "", 10);

            const requiredChecks = [
              "Semantic review",
              "Migration composition",
              "Rust compile",
              "Python syntax",
            ];

            let pulls;
            if (Number.isInteger(requested) && requested > 0) {
              pulls = [(await github.rest.pulls.get({ owner, repo, pull_number: requested })).data];
            } else {
              pulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "open",
                per_page: 100,
              });
            }

            const rows = [];
            for (const listed of pulls) {
              const pull_number = listed.number;
              const pr = (await github.rest.pulls.get({ owner, repo, pull_number })).data;
              const sha = pr.head.sha;
              const blockers = [];

              if (pr.base.ref !== "main") blockers.push(`base=${pr.base.ref}`);
              if (pr.draft) blockers.push("draft");
              if (pr.head.repo?.full_name !== `${owner}/${repo}`) blockers.push("fork");

              const comparison = await github.request(
                "GET /repos/{owner}/{repo}/compare/{basehead}",
                { owner, repo, basehead: `${pr.base.sha}...${sha}` },
              );
              if ((comparison.data.behind_by || 0) > 0) {
                blockers.push(`behind main by ${comparison.data.behind_by}`);
              }
              if (pr.mergeable !== true || pr.mergeable_state === "dirty") {
                blockers.push(`mergeable=${pr.mergeable}/${pr.mergeable_state}`);
              }

              const checkResponse = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: sha,
                filter: "latest",
                per_page: 100,
              });
              const runs = (checkResponse.data.check_runs || []).filter(
                (check) => check.head_sha === sha,
              );
              const byName = new Map(
                runs
                  .filter((check) => check.app?.slug === "github-actions")
                  .map((check) => [check.name, check]),
              );
              for (const name of requiredChecks) {
                const check = byName.get(name);
                if (!check) {
                  blockers.push(`missing ${name}`);
                } else if (check.status !== "completed" || check.conclusion !== "success") {
                  blockers.push(`${name}=${check.status}/${check.conclusion || "pending"}`);
                }
              }
              for (const check of runs) {
                if (requiredChecks.includes(check.name) && check.app?.slug === "github-actions") continue;
                if (check.status !== "completed" || !["success", "neutral", "skipped"].includes(check.conclusion || "")) {
                  blockers.push(`${check.name}=${check.status}/${check.conclusion || "pending"}`);
                }
              }

              const statusResponse = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: sha,
                per_page: 100,
              });
              for (const status of statusResponse.data.statuses || []) {
                if (status.state !== "success") blockers.push(`${status.context}=${status.state}`);
              }

              const verdict = blockers.length ? "not ready" : "checks green, manual review and merge required";
              core.notice(`PR #${pull_number} @ ${sha.slice(0, 12)}: ${verdict}${blockers.length ? ` (${blockers.join("; ")})` : ""}`);
              rows.push([`#${pull_number}`, sha.slice(0, 12), verdict, blockers.join("; ") || "none"]);
            }

            await core.summary
              .addHeading("Merge readiness (report-only, no automatic merge)")
              .addTable([
                [
                  { data: "PR", header: true },
                  { data: "Head", header: true },
                  { data: "Status", header: true },
                  { data: "Blockers", header: true },
                ],
                ...rows,
              ])
              .write();
