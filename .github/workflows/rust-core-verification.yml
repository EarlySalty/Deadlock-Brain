name: Rust Core and Offline Audit Verification

on:
  pull_request:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: brain-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: 2
  SQLX_OFFLINE: 'true'

jobs:
  core:
    name: Core suite (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            packages: '-p brain-contracts -p brain-policy -p deadlock-brain-core'
          - suite: storage
            packages: '-p brain-storage'
          - suite: ingestion
            packages: '-p brain-ingestion'
          - suite: retrieval
            packages: '-p dbrain-retrieval -p dbrain-reasoner'
          - suite: provider-jev
            packages: '-p brain-providers -p brain-jev'
          - suite: kernel-api-consumer
            packages: '-p brain-kernel -p brain-api -p brain-client'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - name: Lockfile acquisition (no application credentials)
        run: cargo fetch --manifest-path rust/Cargo.toml --locked
      - name: Test actual PR checkout offline
        env:
          PACKAGES: ${{ matrix.packages }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .consumer-ci-reports/test-home
          { git rev-parse HEAD; rustc --version; cargo --version; uname -srm; } > .consumer-ci-reports/provenance.txt
          env -i PATH="$PATH" HOME="$PWD/.consumer-ci-reports/test-home" CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" SQLX_OFFLINE=true CARGO_BUILD_JOBS=2 CARGO_NET_OFFLINE=true \
            cargo test --manifest-path rust/Cargo.toml --locked --offline --all-targets $PACKAGES 2>&1 | tee .consumer-ci-reports/tests.log
      - name: Real isolated PostgreSQL contract (storage only)
        if: matrix.suite == 'storage'
        shell: bash
        run: |
          set -euo pipefail
          test -x "$(pg_config --bindir)/initdb"
          test -x "$(pg_config --bindir)/pg_ctl"
          env -i PATH="$PATH" HOME="$PWD/.consumer-ci-reports/test-home" CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" CARGO_BUILD_JOBS=2 CARGO_NET_OFFLINE=true \
            bash scripts/test_brain_core_postgres.sh 2>&1 | tee .consumer-ci-reports/postgres.log
      - name: Consumer lint and synthetic release measurement
        if: matrix.suite == 'kernel-api-consumer'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml -p brain-client -- --check
          cargo clippy --manifest-path rust/Cargo.toml -p brain-client --all-targets --locked --offline -- -D warnings
          cargo test --manifest-path rust/Cargo.toml -p brain-client --release --locked --offline synthetic_contract_throughput -- --nocapture 2>&1 | tee .consumer-ci-reports/synthetic-performance.log
      - name: Provider fixture integrity
        if: matrix.suite == 'provider-jev'
        working-directory: architecture/migration/s07/fixtures
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-${{ matrix.suite }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .consumer-ci-reports/
          if-no-files-found: error
          retention-days: 7

  tooling:
    name: Integrated audit tooling (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: quality-pr27
            manifest: architecture/migration/evals/Cargo.toml
          - suite: cutover-audit
            manifest: infra/cutover/runtime-audit/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - name: Reproduce retained audit tests on PR checkout
        env:
          MANIFEST: ${{ matrix.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .consumer-ci-reports/test-home
          { git rev-parse HEAD; rustc --version; cargo --version; } > .consumer-ci-reports/provenance.txt
          cargo fetch --manifest-path "$MANIFEST" --locked
          cargo fmt --manifest-path "$MANIFEST" -- --check
          cargo clippy --manifest-path "$MANIFEST" --all-targets --locked --offline -- -D warnings
          env -i PATH="$PATH" HOME="$PWD/.consumer-ci-reports/test-home" CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" CARGO_BUILD_JOBS=2 \
            cargo test --manifest-path "$MANIFEST" --all-targets --locked --offline 2>&1 | tee .consumer-ci-reports/tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-${{ matrix.suite }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .consumer-ci-reports/
          if-no-files-found: error
          retention-days: 7

  reference:
    # These independent CODEX B/C/D branches are NOT silently merged into CODEX A.
    # Success here verifies the pinned reference, not cross-branch composition.
    name: Pinned reference suite (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: wiki
            revision: f7fafa5f6bd984df0f94c8117b0c17e2a2a08d27
          - suite: sources
            revision: b44f2fe4f416cc1e2c8c56323fe9e5b2c74415fb
          - suite: replay
            revision: f0b5bf15b9c16d75dcc2df5e7051f97901f5742e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: EarlySalty/Deadlock-Brain
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - name: Record exact reference and acquire locked dependencies
        env:
          EXPECTED: ${{ matrix.revision }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          mkdir -p .consumer-ci-reports/test-home
          { printf 'reference_only=true\n'; git rev-parse HEAD; rustc --version; cargo --version; } > .consumer-ci-reports/provenance.txt
          cargo fetch --manifest-path rust/Cargo.toml --locked
      - name: Wiki offline and typed source integration
        if: matrix.suite == 'wiki'
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --manifest-path architecture/migration/s12/Cargo.toml --locked
          env -i PATH="$PATH" HOME="$PWD/.consumer-ci-reports/test-home" CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" CARGO_BUILD_JOBS=2 SQLX_OFFLINE=true \
            python3 architecture/migration/s12/check-completion.py 2>&1 | tee .consumer-ci-reports/wiki.log
      - name: Source adapter fault injection and regressions
        if: matrix.suite == 'sources'
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME="$PWD/.consumer-ci-reports/test-home" CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" CARGO_BUILD_JOBS=2 SQLX_OFFLINE=true \
            cargo test --manifest-path rust/Cargo.toml -p dbrain-sources -p deadlock-brain-core --all-targets --locked --offline 2>&1 | tee .consumer-ci-reports/sources.log
      - name: Install isolated decoder build dependency
        if: matrix.suite == 'replay'
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
          protoc --version | tee .consumer-ci-reports/protoc.txt
      - name: Synthetic decoder and blocked real-corpus audit
        if: matrix.suite == 'replay'
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --manifest-path architecture/migration/replays/s14/audit/Cargo.toml --locked
          env -i PATH="$PATH" HOME="$PWD/.consumer-ci-reports/test-home" CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" CARGO_BUILD_JOBS=2 SQLX_OFFLINE=true \
            bash architecture/migration/replays/s14/check-decoder.sh 2>&1 | tee .consumer-ci-reports/replay.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reference-${{ matrix.suite }}-${{ matrix.revision }}-${{ github.run_attempt }}
          path: .consumer-ci-reports/
          if-no-files-found: error
          retention-days: 7

  offline-gate:
    name: Consumer Offline Gate
    if: always()
    needs: [core, tooling, reference]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All declared matrices must succeed; no merge or deployment
        env:
          CORE: ${{ needs.core.result }}
          TOOLING: ${{ needs.tooling.result }}
          REFERENCE: ${{ needs.reference.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$CORE" "$TOOLING" "$REFERENCE"; do
            test "$result" = success
          done
      - name: Require all eleven current-attempt suite artifacts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const attempt = String(process.env.GITHUB_RUN_ATTEMPT);
            const expected = [
              ...['core', 'storage', 'ingestion', 'retrieval', 'provider-jev', 'kernel-api-consumer']
                .map(name => `core-${name}-${context.sha}-${attempt}`),
              ...['quality-pr27', 'cutover-audit'].map(name => `audit-${name}-${context.sha}-${attempt}`),
              `reference-wiki-f7fafa5f6bd984df0f94c8117b0c17e2a2a08d27-${attempt}`,
              `reference-sources-b44f2fe4f416cc1e2c8c56323fe9e5b2c74415fb-${attempt}`,
              `reference-replay-f0b5bf15b9c16d75dcc2df5e7051f97901f5742e-${attempt}`,
            ];
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.runId, per_page: 100,
            });
            const missing = expected.filter(name => artifacts.filter(a =>
              a.name === name && !a.expired && a.size_in_bytes > 0).length !== 1);
            if (missing.length) {
              core.setFailed(`Missing, duplicate or expired suite artifacts: ${missing.join(', ')}`);
              return;
            }
            await core.summary.addRaw('All eleven declared offline suites passed. Reference-only Wiki/Sources/Replay evidence is not composed-runtime or production approval. No merge or deployment.').write();
