name: Brain Serve C1 Verification

on:
  pull_request:
    branches: [migration/rust-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-serve-c1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: never
  SQLX_OFFLINE: 'true'

jobs:
  verify:
    name: C1 workspace and real service
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - name: Build prerequisites and provenance
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends protobuf-compiler libprotobuf-dev
          test -x "$(pg_config --bindir)/initdb"
          mkdir -p .core-test-logs/c1/ci-home
          { git rev-parse HEAD; rustc --version; cargo --version; pg_config --version; protoc --version; } > .core-test-logs/c1/provenance.txt
          cargo fetch --manifest-path rust/Cargo.toml --locked
      - name: cargo fmt --all -- --check
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check 2>&1 | tee ../.core-test-logs/c1/fmt.log
      - name: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee ../.core-test-logs/c1/clippy.log
      - name: cargo test --workspace --locked
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME="$GITHUB_WORKSPACE/.core-test-logs/c1/ci-home" CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" SQLX_OFFLINE=true CARGO_BUILD_JOBS=2 CARGO_NET_OFFLINE=true \
            cargo test --workspace --locked 2>&1 | tee ../.core-test-logs/c1/workspace-test.log
      - name: cargo build --workspace --release --locked
        if: always() && !cancelled()
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          cargo build --workspace --release --locked 2>&1 | tee ../.core-test-logs/c1/release.log
      - name: Real brain-serve and disposable PostgreSQL
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME="$GITHUB_WORKSPACE/.core-test-logs/c1/ci-home" CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" SQLX_OFFLINE=true CARGO_BUILD_JOBS=2 CARGO_NET_OFFLINE=true \
            bash scripts/test_brain_serve.sh 2>&1 | tee .core-test-logs/c1/process-e2e.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: brain-serve-c1-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .core-test-logs/c1/*.log
            .core-test-logs/c1/provenance.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
